<!DOCTYPE html>
<html lang="id" data-bg="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pratinjau Motif Header v2 — Referensi vs Hasil</title>
<style>
  :root {
    --m-op: 1;
    --m-scale: 1;
    --m-x: 0px;
    --base-top: #E9F2FD;
    --base-mid: #E1EEFD;
    --base-bot: #EAF2FF;
    --sb-color: #1E293B;
    --ui-title: #0F172A;
    --ui-sub: #475569;
  }
  html[data-bg="dark-blue"] {
    --base-top: #0E3F86;
    --base-mid: #0C3779;
    --base-bot: #0A2F6B;
    --sb-color: #FFFFFF;
    --ui-title: #FFFFFF;
    --ui-sub: rgba(255,255,255,0.86);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #E2E8F0;
    color: #0F172A;
    padding: 18px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .toolbar {
    background: #FFFFFF;
    border: 1px solid rgba(15,23,42,0.1);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    max-width: 860px;
    width: 100%;
  }
  .mode-group {
    display: inline-flex;
    background: #F1F5F9;
    padding: 3px;
    border-radius: 10px;
    gap: 4px;
  }
  .mode-btn {
    border: 0;
    background: transparent;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: #334155;
  }
  .mode-btn.active { background: #0E3F86; color: #FFFFFF; }
  .slider-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #334155;
  }
  .slider-item input[type=range] { width: 110px; accent-color: #0E3F86; }
  .slider-val { font-family: ui-monospace, monospace; font-size: 11px; min-width: 38px; color: #0E3F86; }

  .compare-row {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .panel-lbl {
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .ref-box {
    width: 390px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(15,23,42,0.16);
    background: #FFFFFF;
  }
  .ref-box img { display: block; width: 390px; height: auto; }

  /* Layar HP 390x844 */
  .phone-390 {
    width: 390px;
    height: 844px;
    background: #F3F5F2;
    border-radius: 38px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(15,23,42,0.26), 0 0 0 8px #0F172A;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .apk-header-block {
    position: relative;
    background: linear-gradient(180deg, var(--base-top) 0%, var(--base-mid) 55%, var(--base-bot) 100%);
    padding: 0 14px 18px;
    border-bottom-left-radius: 26px;
    border-bottom-right-radius: 26px;
    overflow: hidden;
    box-shadow: 0 8px 24px -10px rgba(7,22,54,0.22);
  }
  .hdr-motif {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: var(--m-op);
    transform: translateX(var(--m-x)) scale(var(--m-scale));
    transform-origin: center top;
  }
  /* Warna bentuk mode TERANG (diukur dari piksel referensi 528x154) */
  .shape-band-tl { fill: url(#g-tl-light); }
  .shape-wave-ml { fill: url(#g-ml-light); }
  .shape-arc-r   { fill: url(#g-r-light); }
  .shape-glow-tr { fill: url(#g-glow-light); }
  .shape-petal-bl{ fill: url(#g-bl-light); }

  /* Warna bentuk mode BIRU TUA (#0E3F86 -> #0A2F6B) */
  html[data-bg="dark-blue"] .shape-band-tl { fill: url(#g-tl-blue); }
  html[data-bg="dark-blue"] .shape-wave-ml { fill: url(#g-ml-blue); }
  html[data-bg="dark-blue"] .shape-arc-r   { fill: url(#g-r-blue); }
  html[data-bg="dark-blue"] .shape-glow-tr { fill: url(#g-glow-blue); }
  html[data-bg="dark-blue"] .shape-petal-bl{ fill: url(#g-bl-blue); }

  .statusbar {
    position: relative;
    z-index: 2;
    height: 34px;
    padding: 8px 6px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--sb-color);
  }
  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--ui-title); }
  .actions { display: inline-flex; gap: 8px; }
  .pill-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.88);
    color: #0E3F86;
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(15,23,42,0.12);
  }
  html[data-bg="dark-blue"] .pill-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    color: #FFFFFF;
  }
  .greet {
    position: relative; z-index: 2;
    margin: 12px 0 12px;
    font-size: 11.8px; letter-spacing: 0.055em; text-transform: uppercase;
    color: var(--ui-sub);
  }
  .wallet-hero {
    position: relative; z-index: 2;
    background: #FFFFFF; color: #0F172A;
    border-radius: 18px; padding: 16px 15px;
    box-shadow: 0 12px 26px -8px rgba(7,22,54,0.26);
  }
  .wk { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; font-weight: 700; }
  .wb { font-family: ui-monospace, monospace; font-size: 24px; font-weight: 800; margin: 5px 0 0; }
  .body-area { flex: 1; padding: 14px 12px; }
  .card { background: #FFFFFF; border-radius: 18px; padding: 14px; font-size: 12.5px; color: #475569; line-height: 1.5; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="mode-group">
      <button type="button" class="mode-btn active" data-bg-set="light">Latar Terang (Referensi)</button>
      <button type="button" class="mode-btn" data-bg-set="dark-blue">Latar Biru Tua (#0E3F86 → #0A2F6B)</button>
    </div>
    <label class="slider-item">Opacity
      <input type="range" id="s-op" min="0.2" max="1.6" step="0.05" value="1">

    <label class="slider-item">Ukuran
      <input type="range" id="s-sc" min="0.75" max="1.35" step="0.02" value="1">
      <span class="slider-val" id="v-sc">1.00x</span>
    </label>
    <label class="slider-item">Posisi X
      <input type="range" id="s-x" min="-60" max="60" step="2" value="0">
      <span class="slider-val" id="v-x">0px</span>
    </label>
  </div>

<script>
  document.querySelectorAll('[data-bg-set]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-bg-set]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    document.documentElement.setAttribute('data-bg', b.getAttribute('data-bg-set'));
  }));
  const root = document.documentElement;
  document.getElementById('s-op').addEventListener('input', (e) => {
    root.style.setProperty('--m-op', e.target.value);
    document.getElementById('v-op').textContent = Number(e.target.value).toFixed(2);
  });
  document.getElementById('s-sc').addEventListener('input', (e) => {
    root.style.setProperty('--m-scale', e.target.value);
    document.getElementById('v-sc').textContent = Number(e.target.value).toFixed(2) + 'x';
  });
  document.getElementById('s-x').addEventListener('input', (e) => {
    root.style.setProperty('--m-x', e.target.value + 'px');
    document.getElementById('v-x').textContent = e.target.value + 'px';
  });
