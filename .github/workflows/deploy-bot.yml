name: Deploy bot

# Deploy Worker otomatis setiap push ke main yang menyentuh bot/ atau sumber logikanya.
on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'build-bot.js'
      - 'js/core/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Rakit bot/core.mjs dari js/core/* lalu pastikan tes bot lulus sebelum deploy.
      - run: npm run build:bot
      - run: node --check bot/core.mjs
      - run: node --test tests/bot.test.mjs
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
