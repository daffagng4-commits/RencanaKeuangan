name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gagal bila ada error sintaks atau index.html tidak sinkron dengan sumber (js/, css/, index.dev.html)
      - run: npm run check
      - run: npm test
